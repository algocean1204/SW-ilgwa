# 로컬 풀스택 환경 전용 nginx 리버스 프록시 설정
# 프로덕션 구조 근사치: Nginx → Spring Boot / FastAPI / Frontend SPA
# /etc/nginx/nginx.conf 전체 파일로 마운트한다 (events + http 블록 포함)

events {
    # 기본 이벤트 모델 (동시 연결 수)
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    # 대용량 학술 PDF 업로드를 위해 최대 1.5GB(1536MB)까지 받는다
    client_max_body_size 1536m;

    # 기본 타임아웃 설정 (SSE/스트리밍 연결 유지용)
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_connect_timeout 10s;

    upstream frontend {
        # React SPA (nginx 정적 서버)
        server sw-ez-frontend-web:3000;
    }

    upstream spring {
        # Spring Boot 메인 REST API
        server sw-ez-backend-spring:8080;
    }

    upstream fastapi {
        # FastAPI AI 파이프라인 + OCR + Telegram 웹훅
        server sw-ez-backend-fastapi-api:8082;
    }

    server {
        listen 80;
        server_name _;

        # Spring Boot 메인 REST API
        # 경로: /api/*
        location /api/ {
            proxy_pass http://spring;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 스트리밍용 무버퍼 설정. Spring은 SseEmitter를 쓰지 않아 지금은 스트리밍 응답이 없다
            proxy_buffering off;
            proxy_cache off;
            proxy_set_header Connection '';
            chunked_transfer_encoding on;
        }

        # FastAPI 명시적 AI API 엔드포인트
        # 경로: /fastapi/api/* → FastAPI /api/*
        # Spring /api 와 충돌하지 않도록 공개 프리픽스만 분리하고 상류 /api 는 보존한다.
        location = /fastapi/api {
            rewrite ^ /api break;
            proxy_pass http://fastapi;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Q&A 실시간 SSE 스트리밍 지원 (FastAPI StreamingResponse)
            proxy_buffering off;
            proxy_cache off;
            proxy_set_header Connection '';
            chunked_transfer_encoding on;
        }

        location /fastapi/api/ {
            rewrite ^/fastapi/api(/.*)$ /api$1 break;
            proxy_pass http://fastapi;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Q&A 실시간 SSE 스트리밍 지원 (FastAPI StreamingResponse)
            proxy_buffering off;
            proxy_cache off;
            proxy_set_header Connection '';
            chunked_transfer_encoding on;
        }

        location = /fastapi {
            rewrite ^ /health break;
            proxy_pass http://fastapi;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /fastapi/ {
            # 프론트의 FastAPI 기준 경로는 /fastapi 이고, 상류에는 실제 마운트 경로만 남긴다.
            rewrite ^/fastapi(/.*)$ $1 break;
            proxy_pass http://fastapi;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # FastAPI 실시간 응답과 미디어 응답을 모두 통과시킨다.
            proxy_buffering off;
            proxy_cache off;
            proxy_set_header Connection '';
            chunked_transfer_encoding on;
        }

        # FastAPI AI 파이프라인 엔드포인트
        # 경로: /ai/* → FastAPI /api/*
        # 경로: /ai/api/* → FastAPI /api/*
        # 해당: 과외/커리큘럼 생성, 채점, Q&A SSE, 개념맵, 모의고사 등
        location = /ai {
            rewrite ^ /api break;
            proxy_pass http://fastapi;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Q&A 실시간 SSE 스트리밍 지원 (FastAPI StreamingResponse)
            proxy_buffering off;
            proxy_cache off;
            proxy_set_header Connection '';
            chunked_transfer_encoding on;
        }

        location = /ai/api {
            rewrite ^ /api break;
            proxy_pass http://fastapi;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Q&A 실시간 SSE 스트리밍 지원 (FastAPI StreamingResponse)
            proxy_buffering off;
            proxy_cache off;
            proxy_set_header Connection '';
            chunked_transfer_encoding on;
        }

        location /ai/api/ {
            rewrite ^/ai/api(/.*)$ /api$1 break;
            proxy_pass http://fastapi;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Q&A 실시간 SSE 스트리밍 지원 (FastAPI StreamingResponse)
            proxy_buffering off;
            proxy_cache off;
            proxy_set_header Connection '';
            chunked_transfer_encoding on;
        }

        location /ai/ {
            rewrite ^/ai(/.*)$ /api$1 break;
            proxy_pass http://fastapi;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Q&A 실시간 SSE 스트리밍 지원 (FastAPI StreamingResponse)
            proxy_buffering off;
            proxy_cache off;
            proxy_set_header Connection '';
            chunked_transfer_encoding on;
        }

        # FastAPI OCR 전용 경로
        # 경로: /ocr/* → FastAPI /api/ocr/*
        location = /ocr {
            rewrite ^ /api/ocr break;
            proxy_pass http://fastapi;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_cache off;
        }

        location /ocr/ {
            rewrite ^/ocr(/.*)$ /api/ocr$1 break;
            proxy_pass http://fastapi;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_cache off;
        }

        # FastAPI Telegram 웹훅
        # 경로: /telegram/* → FastAPI /telegram/* 로 prefix를 보존한다.
        location = /telegram {
            proxy_pass http://fastapi;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /telegram/ {
            proxy_pass http://fastapi;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # FastAPI 내부 엔드포인트 (Spring과 FastAPI 사이 VPC 통신)
        # 로컬 개발에서도 같은 라우팅 구조를 쓴다
        # 경로: /internal/* → FastAPI /internal/* 로 prefix를 보존한다.
        location = /internal {
            proxy_pass http://fastapi;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /internal/ {
            proxy_pass http://fastapi;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # FastAPI 생성 미디어 파일
        # 경로: /media/* → FastAPI /media/* 로 마운트 경로를 보존한다.
        location /media/ {
            proxy_pass http://fastapi;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # nginx 자체 헬스 체크 (curl -sf http://localhost/nginx-health)
        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # React SPA 프론트엔드 (나머지 모든 경로의 기본값)
        # React Router 새로고침은 upstream nginx가 처리한다
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
