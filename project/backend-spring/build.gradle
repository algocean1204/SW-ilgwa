// Spring Boot 3.4.5 + Java 21 빌드 스크립트
plugins {
    id 'org.springframework.boot' version '3.4.5'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.diffplug.spotless' version '6.19.0'
    id 'java'
}

group = 'com.swez'
version = '0.0.1-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

repositories {
    mavenCentral()
}

dependencies {
    // REST API용 web 스타터 (Tomcat 내장)
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // @Valid, @Validated 유효성 검증 활성화
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // API 문서 자동 생성 (Spring Boot 3.x 전용)
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.8'

    // JPA + PostgreSQL
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    runtimeOnly 'org.postgresql:postgresql'

    // Redis
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    // ULID 생성
    implementation 'com.github.f4b6a3:ulid-creator:5.2.3'

    // Google ID Token 검증
    implementation 'com.google.api-client:google-api-client:2.7.0'

    // Spring Security
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // JWT
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    // OAuth2 클라이언트 (Google, Kakao)
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'

    // AWS S3 음성 샘플 파일 업로드
    implementation platform('software.amazon.awssdk:bom:2.31.0')
    implementation 'software.amazon.awssdk:auth'
    implementation 'software.amazon.awssdk:regions'
    implementation 'software.amazon.awssdk:s3'

    // JSON 구조화 로깅 (운영 환경)
    implementation 'net.logstash.logback:logstash-logback-encoder:8.0'

    // Flyway (PostgreSQL 전용 모듈 포함)
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'

    // 보일러플레이트 코드 제거
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // 테스트 (JUnit5, Mockito, AssertJ 포함)
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // ArchUnit: 도메인 패키지 간 의존 방향을 검사해 순환 의존과 경계 위반을 막는다
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.3.0'
}

// bootJar 태스크는 Dockerfile의 ./gradlew bootJar --no-daemon 호출과 맞춰 기본 설정을 유지한다
tasks.named('bootJar') {
    archiveFileName = 'app.jar'
}

// spring-boot-starter-test의 JUnit Jupiter 러너를 쓴다
tasks.named('test') {
    useJUnitPlatform()
}

spotless {
    java {
        googleJavaFormat()
        importOrder('java', 'javax', 'jakarta', 'org', 'com')
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
        licenseHeader '/* \n * Copyright (c) EZ TEAM \n */'
        formatAnnotations()
        indentWithSpaces(2)
        encoding 'UTF-8'
    }
}
