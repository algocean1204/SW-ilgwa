[package]
name = "lib_rust"
version = "0.1.0"
edition = "2021"
description = "OCR 전처리용 PyO3 Rust 라이브러리 (FastAPI VM in-process 소비)"
license = "Apache-2.0"

# PyO3 Python 확장 모듈은 cdylib 타입으로 빌드되어야 한다
[lib]
name = "lib_rust"
crate-type = ["cdylib"]

[dependencies]
# PyO3 바인딩. abi3-py312로 Python 3.12 ABI를 고정하고, extension-module로 인터프리터를 링크하지 않는다
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py312"] }
# PDF를 이미지로 래스터화한다 (Pdfium 바인딩)
pdfium-render = { version = "0.8", features = ["image"] }
# 이미지 디코딩·인코딩·리사이즈·변환 일반
image = "0.25"

[profile.release]
# 라이브러리 배포 시 바이너리 크기·성능 균형
opt-level = 3
lto = true
codegen-units = 1
strip = true
